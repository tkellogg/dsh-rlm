[project]
name = "dsh-rlm"
version = "0.1.0"
description = "Python-native agents on DeepSeek Harness, launched with uvx"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dill>=0.3.8",
    "pydantic>=2.11",
]

[project.scripts]
dsh-rlm = "dsh_rlm.cli:main"

[project.urls]
Homepage = "https://github.com/tkellogg/dsh-rlm"
Repository = "https://github.com/tkellogg/dsh-rlm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/dsh_rlm", "tests", "README.md", "pyproject.toml", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_rlm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
