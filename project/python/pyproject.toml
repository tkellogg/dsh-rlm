[project]
name = "dsh-rlm"
version = "0.1.0"
description = "Pure Python runtime primitives for DSH RLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dill>=0.3.8",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_rlm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
